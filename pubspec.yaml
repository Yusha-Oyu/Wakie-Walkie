name: alarm_app
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ">=3.0.0<4.0.0"

dependencies:
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.0.0
  pedometer: ^4.1.1
  permission_handler: ^11.3.0

  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/test.mp3
    - assets/sounds/neww.mp3

flutter_native_splash:
  color: "#FFC107"
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: false

  image_path_android: assets/icons/icon_foreground.png

  adaptive_icon_foreground: assets/icons/icon_foreground.png
  adaptive_icon_background: assets/icons/icon_background.png

  